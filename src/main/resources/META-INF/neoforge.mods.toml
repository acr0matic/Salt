modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[mixins]]
config="mixins.salt.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="appleskin"
type="optional"
versionRange="[3.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="legendarysurvivaloverhaul"
type="optional"
versionRange="[2.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="spelunkery"
type="optional"
versionRange="[0.4,)"
ordering="AFTER"
side="BOTH"
