plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "salt-${project.minecraft_version}"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'AppleSkin'
        url = 'https://maven.ryanliptak.com/'
    }
    maven {
        name = 'Tterrag'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    flatDir {
        name = 'extra-mods'
        dir file("extra-mods-${project.minecraft_version}")
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
    localRuntime "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"

    compileOnly "squeek.appleskin:appleskin-neoforge:mc${project.appleskin_minecraft_version}-${project.appleskin_version}:api"
    localRuntime "squeek.appleskin:appleskin-neoforge:mc${project.appleskin_minecraft_version}-${project.appleskin_version}"

    fileTree(dir: "extra-mods-${project.minecraft_version}", include: '*.jar').each { extraModJar ->
        String basename = extraModJar.name.substring(0, extraModJar.name.length() - '.jar'.length())
        int versionSeparator = basename.lastIndexOf('-')
        if (versionSeparator >= 0) {
            String artifactId = basename.substring(0, versionSeparator)
            String extraModVersion = basename.substring(versionSeparator + 1)
            localRuntime "extra-mods:${artifactId}:${extraModVersion}"
        }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description       : project.mod_description
    ]
    inputs.properties(replaceProperties)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
